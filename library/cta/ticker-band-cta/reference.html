<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ticker Band CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --color-ink: #0b0b0c;
    --color-paper: #f2efe8;
    --color-muted: #8a877f;
    --color-ember: #ff5a1f;
    --radius-pill: 999px;
    --radius-card: 28px;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-ink); font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--color-ember); outline-offset: 3px; }

  .cta-section { padding: 12px; }
  .card { background: var(--color-paper); color: var(--color-ink); border-radius: var(--radius-card); overflow: hidden; }

  .ticker { height: 44px; background: var(--color-ember); overflow: hidden; display: flex; align-items: center; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: .14em; }
  .track { display: flex; width: max-content; animation: tick 28s linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .track span { display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; white-space: nowrap; }
  .track span::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--color-ink); }
  @keyframes tick { to { transform: translateX(-50%); } }

  .body { padding: clamp(48px, 9vw, 128px) clamp(24px, 6vw, 96px); display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: end; }
  @media (max-width: 899px) { .body { grid-template-columns: 1fr; } }
  h2 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(3rem, 7.5vw, 7.5rem); line-height: .95; letter-spacing: -0.03em; }
  .copy p { font-size: 17px; line-height: 1.55; color: var(--color-muted); max-width: 360px; }
  .row { display: flex; gap: 20px; margin-top: 28px; align-items: center; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-paper); font-weight: 500; font-size: 15px; }
  .roll { display: block; height: 1.2em; line-height: 1.2em; overflow: hidden; }
  .roll > span { display: flex; flex-direction: column; transition: transform 450ms var(--ease-out-expo); }
  .btn:hover .roll > span { transform: translateY(-50%); }

  .link { position: relative; font-size: 15px; font-weight: 500; }
  .link::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 1px; background: currentColor; transform-origin: left; transition: transform 450ms var(--ease-out-expo); }
  .link:hover::after { transform: scaleX(0); transform-origin: right; }

  .rise { opacity: 0; transform: translateY(40px); transition: opacity 1000ms var(--ease-out-expo), transform 1000ms var(--ease-out-expo); }
  .rise.in { opacity: 1; transform: none; }
  .copy.rise { transition-delay: 150ms; }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
    .rise { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
<section class="cta-section" data-block>
  <div class="card">
    <div class="ticker" aria-hidden="true"><span hidden data-slot="ticker_text">Ship faster · Sleep better · Know first</span><div class="track"></div></div>
    <div class="body">
      <h2 class="rise" data-slot="headline">Ready when your data is.</h2>
      <div class="copy rise">
        <p data-slot="body">Connect a source in two minutes. No credit card, no sales call, no lock-in.</p>
        <div class="row">
          <a class="btn" href="#"><span class="roll"><span><span data-slot="cta_label">Get started</span><span aria-hidden="true" data-slot="cta_label">Get started</span></span></span></a>
          <a class="link" href="#" data-slot="secondary_label">Talk to an engineer</a>
        </div>
      </div>
    </div>
  </div>
</section>
<script type="module">
  const TEXT = document.querySelector("[data-slot=ticker_text]").textContent;
  const track = document.querySelector(".track");
  const probe = document.createElement("span");
  probe.textContent = TEXT;
  track.append(probe);
  const copies = Math.max(2, Math.ceil((innerWidth * 2) / Math.max(1, probe.offsetWidth)));
  // Even count so the -50% loop lands on an identical frame.
  track.replaceChildren(...Array.from({ length: copies + (copies % 2) }, () => probe.cloneNode(true)));

  const io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }, { threshold: 0.25 });
  document.querySelectorAll(".rise").forEach((el) => io.observe(el));
</script>
</body>
</html>
