<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Northwind — Ember Field Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&display=swap" rel="stylesheet" />
<script type="importmap">
{ "imports": { "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.mjs" } }
</script>
<style>
  :root {
    --color-ink: #0b0b0c;
    --color-paper: #f2efe8;
    --color-muted: #8a877f;
    --color-ember: #ff5a1f;
    --color-hairline: rgb(242 239 232 / 0.14);
    --radius-pill: 999px;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --pad: 40px;
  }
  @media (max-width: 767px) { :root { --pad: 24px; } }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-ink); color: var(--color-paper); font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--color-ember); outline-offset: 3px; }

  .hero { position: relative; height: 100svh; min-height: 40rem; overflow: hidden; isolation: isolate; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }

  .hero header { position: absolute; top: 0; left: 0; right: 0; padding: 28px var(--pad); display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
  .brand i { width: 10px; height: 10px; background: var(--color-ember); display: block; }
  .hero nav { display: flex; gap: 32px; font-size: 14px; }
  .hero nav a { color: var(--color-muted); transition: color .2s; }
  .hero nav a:hover { color: var(--color-paper); }
  .ghost { border: 1px solid var(--color-hairline); padding: 10px 18px; border-radius: var(--radius-pill); font-size: 14px; }
  @media (max-width: 767px) { .hero nav { display: none; } }

  .content { position: absolute; left: var(--pad); right: var(--pad); bottom: 48px; display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
  @media (max-width: 767px) { .content { flex-direction: column; align-items: flex-start; } }
  h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(3.5rem, 9vw, 9.5rem); line-height: .92; letter-spacing: -0.03em; }
  h1 .line { display: block; }
  h1 .line + .line { font-style: italic; color: var(--color-ember); }
  .w { display: inline-block; overflow: hidden; padding-bottom: .08em; vertical-align: top; }
  .w > span { display: inline-block; transform: translateY(110%); transition: transform 900ms var(--ease-out-expo); }
  .ready .w > span { transform: none; }

  .side { max-width: 340px; opacity: 0; transform: translateY(16px); transition: opacity 700ms var(--ease-out-expo) 600ms, transform 700ms var(--ease-out-expo) 600ms; }
  .ready .side { opacity: 1; transform: none; }
  .side p { font-size: 16px; line-height: 1.55; color: var(--color-muted); }
  .cta { margin-top: 24px; display: inline-flex; align-items: center; gap: 10px; background: var(--color-paper); color: var(--color-ink); font-weight: 500; font-size: 15px; padding: 14px 22px; border-radius: var(--radius-pill); }
  .cta svg { width: 16px; height: 16px; transition: transform 200ms var(--ease-out-expo); }
  .cta:hover svg { transform: translateX(4px); }

  .rule { position: absolute; left: 0; right: 0; bottom: 24px; height: 1px; background: var(--color-hairline); transform: scaleX(0); transform-origin: left; transition: transform 1200ms var(--ease-out-expo) 300ms; }
  .ready .rule { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .w > span, .side, .rule { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <section class="hero" id="hero">
    <canvas aria-hidden="true"></canvas>
    <header>
      <a class="brand" href="#"><i></i>Northwind</a>
      <nav aria-label="Primary"><a href="#">Product</a><a href="#">Customers</a><a href="#">Pricing</a></nav>
      <a class="ghost" href="#">Sign in</a>
    </header>
    <div class="content">
      <h1><span class="line">Signal over</span><span class="line">noise.</span></h1>
      <div class="side">
        <p>Infrastructure analytics that surfaces the one metric that matters, the moment it moves.</p>
        <a class="cta" href="#">Start free trial
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
    <div class="rule"></div>
  </section>
</main>
<script type="module">
  // Smooth scroll is an enhancement: the hero must still animate if the CDN is unreachable.
  import("lenis").then(({ default: Lenis }) => {
    const lenis = new Lenis({ smoothWheel: true });
    requestAnimationFrame(function raf(t) { lenis.raf(t); requestAnimationFrame(raf); });
  }).catch(() => {});

  // Split headline words into clip-mask boxes with a running stagger.
  const STAGGER = 90, DELAY = 150;
  let n = 0;
  for (const line of document.querySelectorAll("h1 .line")) {
    line.innerHTML = line.textContent.trim().split(/\s+/)
      .map((w) => `<span class="w"><span style="transition-delay:${DELAY + STAGGER * n++}ms">${w}</span></span>`)
      .join(" ");
  }
  requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById("hero").classList.add("ready")));

  // Dot field.
  const section = document.getElementById("hero");
  const canvas = section.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const SPACING = 22, RADIUS = 180, MAX_R = 2.6, BASE_A = 0.14, MAX_A = 0.9, LERP = 0.08;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, dpr = 1, visible = true, frame = 0;
  const target = { x: 0, y: 0 }, pointer = { x: 0, y: 0 };

  function idle() { target.x = w * 0.7; target.y = h * 0.45; }
  function resize() {
    dpr = Math.min(devicePixelRatio, 2);
    w = section.clientWidth; h = section.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    idle(); pointer.x = target.x; pointer.y = target.y;
  }
  const smooth = (x) => x * x * (3 - 2 * x);

  function draw(t) {
    pointer.x += (target.x - pointer.x) * LERP;
    pointer.y += (target.y - pointer.y) * LERP;
    ctx.clearRect(0, 0, w, h);
    for (let y = SPACING / 2; y < h; y += SPACING) {
      for (let x = SPACING / 2; x < w; x += SPACING) {
        let r = 1 + 0.6 * Math.sin(x * 0.012 + y * 0.008 + t * 0.0006);
        const d = Math.hypot(x - pointer.x, y - pointer.y);
        const k = d < RADIUS ? smooth(1 - d / RADIUS) : 0;
        r += (MAX_R - r) * k;
        ctx.fillStyle = k > 0
          ? `rgba(${Math.round(242 + (255 - 242) * k)},${Math.round(239 + (90 - 239) * k)},${Math.round(232 + (31 - 232) * k)},${BASE_A + (MAX_A - BASE_A) * k})`
          : `rgba(242,239,232,${BASE_A})`;
        ctx.beginPath(); ctx.arc(x, y, Math.max(r, 0.2), 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function loop(t) {
    draw(reduce ? 0 : t);
    frame = visible && !reduce ? requestAnimationFrame(loop) : 0;
  }

  section.addEventListener("pointermove", (e) => {
    const r = section.getBoundingClientRect();
    target.x = e.clientX - r.left; target.y = e.clientY - r.top;
    if (reduce) draw(0);
  }, { passive: true });
  section.addEventListener("pointerleave", idle, { passive: true });
  new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;
    if (visible && !frame) frame = requestAnimationFrame(loop);
  }).observe(section);
  addEventListener("resize", resize, { passive: true });
  resize();
  frame = requestAnimationFrame(loop);
</script>
</body>
</html>
