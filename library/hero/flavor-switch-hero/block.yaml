slug: flavor-switch-hero
name: Flavor Switch Hero
category: hero
tone: dark
moods: [playful, bold]
tier: power
targets: [html, react, next]
summary: >-
  One-screen product hero for a two-flavour drink: the product tilts toward the pointer among
  floating bits that dodge the cursor and rising bubbles, and picking a flavour card flips the
  product, morphs the background colour and bursts the bits out in the new flavour.

tokens:
  colors:
    ink: "#0b0b0c"
    paper: "#f2efe8"
    muted: "#8a877f"
    ember: "#ff5a1f"
  fonts:
    - { family: Instrument Serif, weights: [400], role: display }
    - { family: Instrument Serif, weights: [400], role: display, italic: true }
    - { family: Geist, weights: [400, 500], role: body }
  radii:
    pill: "999px"
  easings:
    out-expo: "cubic-bezier(0.16, 1, 0.3, 1)"
    back: "cubic-bezier(0.34, 1.56, 0.64, 1)"

slots:
  - { key: brand, label: Marka adı, type: text, default: Fizzwell }
  - { key: cta_top, label: Üst buton, type: text, default: Find a store }
